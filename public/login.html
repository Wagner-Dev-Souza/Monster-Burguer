<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar — Monster Burguer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
  <div class="conteudo">
    <div class="container container-estreito" style="padding-top:44px;">
      <div style="text-align:center; margin-bottom:18px;">
        <img src="/img/monstros/fantasma.svg" alt="Fantasma" data-mascote-aleatorio style="width:118px;">
        <h1 style="margin:4px 0 0; text-transform:uppercase; letter-spacing:1px;">
          Monster <span style="color:var(--verde-brilho)">Burguer</span>
        </h1>
        <p style="color:var(--texto-suave); margin:2px 0 0;">Entre pra escolher seu lanche 🍔</p>
      </div>

      <div class="card">
        <h2><span class="emoji">🚪</span> Entrar</h2>
        <p class="ajuda">Use seu CPF e sua senha.</p>

        <form id="form-login">
          <label for="cpf">CPF</label>
          <input id="cpf" name="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00" required>

          <label for="senha">Senha</label>
          <div class="campo-senha">
            <input id="senha" name="senha" type="password" placeholder="••••••" required>
            <button type="button" class="botao-olho"
                    data-alternar-senha="#senha"
                    aria-label="Mostrar senha" aria-pressed="false">👁️</button>
          </div>

          <button type="submit" class="botao" id="botao">Entrar</button>
        </form>

        <div class="mensagem" id="mensagem"></div>

        <p style="text-align:center; margin:18px 0 0; font-size:.9rem; color:var(--texto-suave);">
          Não tem conta? <a href="/cadastro.html">Cadastre-se</a>
        </p>
      </div>

      <p class="rodape">
        🍔🍔🍔Fome de Monstro...🍔🍔🍔
      </p>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/senha.js"></script>
  <script src="/js/mascote.js"></script>
  <!-- type="module": escopo isolado, sem risco de colidir nomes com o script da página -->
  <script type="module" src="/js/musica.js"></script>
  <script>
    const form = document.getElementById('form-login');
    const aviso = document.getElementById('mensagem');
    const botao = document.getElementById('botao');
    const campoCpf = document.getElementById('cpf');

    // Veio do cadastro? Mostra o aviso de sucesso.
    if (new URLSearchParams(window.location.search).get('cadastro') === 'sucesso') {
      mostrarMensagem(aviso, 'Conta criada com sucesso! Agora faça login para continuar 🍔', 'sucesso');
    }

    // Máscara de CPF enquanto digita (000.000.000-00)
    campoCpf.addEventListener('input', () => {
      const d = apenasDigitos(campoCpf.value).slice(0, 11);
      campoCpf.value = d
        .replace(/^(\d{3})(\d)/, '$1.$2')
        .replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3')
        .replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
    });

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();
      botao.disabled = true;

      try {
        const { usuario } = await API.post('/api/auth/login', {
          cpf: apenasDigitos(campoCpf.value),
          senha: document.getElementById('senha').value,
        });

        // 🎵 A musiquinha NÃO para aqui: ela continua tocando pelo site inteiro
        // (loja, painel...). O tema retoma da mesma posição na próxima página.

        // Redireciona pelo PAPEL: é o que separa cliente de admin na prática.
        window.location.href = usuario.papel === 'admin' ? '/admin/painel.html' : '/loja.html';
      } catch (erro) {
        mostrarMensagem(aviso, erro.message, 'erro');
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
