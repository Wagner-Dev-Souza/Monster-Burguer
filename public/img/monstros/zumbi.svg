<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Zumbi chibi">
  <title>Zumbi</title>
  <ellipse cx="100" cy="244" rx="50" ry="9" fill="#0b2a1a" opacity=".35"/>

  <!-- corpo / camisa rasgada -->
