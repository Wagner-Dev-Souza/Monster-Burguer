  <path d="M74 40c-2-10 4-16 10-18M112 34c6-8 14-8 20-4" stroke="#3e2723" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- olhos assimétricos (um maior) -->
  <ellipse cx="80" cy="98" rx="14" ry="16" fill="#fff"/>
  <ellipse cx="120" cy="100" rx="10" ry="12" fill="#fff"/>
  <circle cx="80" cy="99" r="7.5" fill="#455a64"/>
  <circle cx="121" cy="101" r="5.5" fill="#455a64"/>
  <circle cx="80" cy="99" r="3.5" fill="#1f1510"/>
  <circle cx="121" cy="101" r="3" fill="#1f1510"/>

  <!-- boca costurada -->
  <path d="M84 128c10 6 22 4 30-2" stroke="#2e4b3a" stroke-width="4" fill="none" stroke-linecap="round"/>
  <g stroke="#2e4b3a" stroke-width="3" stroke-linecap="round">
