  <circle cx="82" cy="214" r="6" fill="#33691e" opacity=".7"/>
  <circle cx="126" cy="196" r="5" fill="#33691e" opacity=".7"/>

  <!-- braços caídos -->
  <path d="M64 196c-14 4-20 14-18 26" stroke="#8fbf9f" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M136 196c14 4 20 14 18 26" stroke="#8fbf9f" stroke-width="17" stroke-linecap="round" fill="none"/>

  <!-- cabeça -->
  <circle cx="100" cy="98" r="52" fill="#8fbf9f"/>

  <!-- cabelo bagunçado -->
