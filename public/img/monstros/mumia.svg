<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Faraó Múmia chibi">
  <title>Faraó Múmia</title>
  <!-- sombra no chão -->
  <ellipse cx="100" cy="244" rx="50" ry="9" fill="#0b2a1a" opacity=".35"/>

  <!-- corpo enrolado em bandagens -->
  <path d="M64 246c-6-52 6-86 36-86s42 34 36 86z" fill="#efe2c2"/>
  <g stroke="#d6c396" stroke-width="4" fill="none">
    <path d="M68 218c22 8 44-6 64 2"/>
    <path d="M66 198c24 8 46-6 68 2"/>
    <path d="M72 178c18 6 38-4 56 0"/>
  </g>

  <!-- braços -->
  <path d="M62 192c-14 6-20 18-17 30" stroke="#efe2c2" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M138 192c14 6 20 18 17 30" stroke="#efe2c2" stroke-width="17" stroke-linecap="round" fill="none"/>

  <!-- cabeça -->
  <circle cx="100" cy="96" r="52" fill="#f5e9cf"/>

  <!-- toucado nemes -->
  <path d="M48 94c0-33 23-50 52-50s52 17 52 50c0 11-3 19-7 23l-9-3c4-16-6-29-36-29s-40 13-36 29l-9 3c-4-4-7-12-7-23z" fill="#1f6f8b"/>
  <path d="M56 76h88M54 88h92" stroke="#ffd60a" stroke-width="5"/>

  <!-- bandagens sobre o rosto -->
  <g stroke="#e6d7ad" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M64 120c24 9 48-5 72 3"/>
    <path d="M78 44c6 6 12 8 22 8"/>
  </g>

  <!-- olhos grandes -->
  <ellipse cx="82" cy="102" rx="13" ry="15" fill="#1f1510"/>
  <ellipse cx="118" cy="102" rx="13" ry="15" fill="#1f1510"/>
  <circle cx="86" cy="96" r="4.5" fill="#fff"/>
  <circle cx="122" cy="96" r="4.5" fill="#fff"/>
  <!-- bochechas -->
  <ellipse cx="66" cy="118" rx="9" ry="6" fill="#ff8a80" opacity=".55"/>
  <ellipse cx="134" cy="118" rx="9" ry="6" fill="#ff8a80" opacity=".55"/>
  <!-- sorriso -->
  <path d="M92 128c5 6 11 6 16 0" stroke="#1f1510" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- amuleto de escaravelho -->
  <circle cx="100" cy="200" r="12" fill="#ffd60a" stroke="#c99700" stroke-width="3"/>
  <path d="M100 192v16M94 198l12 4" stroke="#8a6a00" stroke-width="3" stroke-linecap="round"/>
</svg>
