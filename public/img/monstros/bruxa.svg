<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Bruxa chibi">
  <title>Bruxa</title>
  <ellipse cx="100" cy="244" rx="48" ry="8" fill="#0b2a1a" opacity=".30"/>

  <!-- capa -->
  <path d="M100 152c26 0 46 28 50 94H50c4-66 24-94 50-94z" fill="#5e35b1"/>
  <path d="M100 152c26 0 46 28 50 94H100z" fill="#7e57c2"/>
  <!-- gola alta -->
  <path d="M66 160l-12-40 20 22zM134 160l12-40-20 22z" fill="#4527a0"/>

  <!-- corpo/vestido -->
  <path d="M76 246c-6-42 4-70 24-70s30 28 24 70z" fill="#311b92"/>

  <!-- vassoura -->
  <g transform="rotate(14 152 214)">
    <rect x="148" y="176" width="8" height="60" rx="4" fill="#8d6e63"/>
    <path d="M132 232h40l-6 18h-28z" fill="#ffd60a"/>
    <g stroke="#e0a800" stroke-width="3">
      <path d="M138 232v18M148 232v18M158 232v18M166 232v18"/>
    </g>
  </g>

  <!-- braços -->
  <path d="M70 196c-14 6-18 18-15 28" stroke="#311b92" stroke-width="15" stroke-linecap="round" fill="none"/>
  <path d="M130 196c14 4 20 12 22 22" stroke="#311b92" stroke-width="15" stroke-linecap="round" fill="none"/>

  <!-- cabeça (pele verdinha) -->
