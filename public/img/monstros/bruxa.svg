  <path d="M56 108c-6 18-4 34 2 44" stroke="#7e57c2" stroke-width="10" fill="none" stroke-linecap="round"/>
  <path d="M144 108c6 18 4 34-2 44" stroke="#7e57c2" stroke-width="10" fill="none" stroke-linecap="round"/>

  <!-- chapéu de bruxa -->
  <path d="M64 56h72l-8-16H72z" fill="#1b5e20"/>
  <ellipse cx="100" cy="56" rx="46" ry="11" fill="#1b5e20"/>
  <path d="M100 40c-8-26 6-40 20-46-4 14-2 30 6 46z" fill="#1b5e20"/>
  <path d="M70 50h60" stroke="#ffd60a" stroke-width="6"/>
  <rect x="92" y="44" width="16" height="14" rx="3" fill="#ffd60a" stroke="#c99700" stroke-width="2"/>

  <!-- olhos -->
  <ellipse cx="82" cy="104" rx="13" ry="15" fill="#fff"/>
  <ellipse cx="118" cy="104" rx="13" ry="15" fill="#fff"/>
  <circle cx="82" cy="105" r="7.5" fill="#6a1b9a"/>
  <circle cx="118" cy="105" r="7.5" fill="#6a1b9a"/>
  <circle cx="82" cy="105" r="3.5" fill="#1f1510"/>
  <circle cx="118" cy="105" r="3.5" fill="#1f1510"/>
  <circle cx="86" cy="100" r="2.5" fill="#fff"/>

  <!-- sobrancelhas, bochechas e sorriso -->
  <path d="M70 86l16 6M130 86l-16 6" stroke="#4a148c" stroke-width="4" stroke-linecap="round"/>
  <ellipse cx="64" cy="120" rx="8" ry="5" fill="#c5e1a5" opacity=".9"/>
  <ellipse cx="136" cy="120" rx="8" ry="5" fill="#c5e1a5" opacity=".9"/>
  <path d="M90 128c6 6 14 6 20 0" stroke="#33691e" stroke-width="4" fill="none" stroke-linecap="round"/>
