<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="Frankenstein chibi">
  <title>Frankenstein</title>
  <ellipse cx="100" cy="244" rx="50" ry="9" fill="#0b2a1a" opacity=".35"/>

  <!-- corpo / jaleco -->
  <path d="M64 246c-6-50 6-84 36-84s42 34 36 84z" fill="#37474f"/>
  <path d="M92 162l8 22 8-22z" fill="#eceff1"/>
  <path d="M100 184l-6 62M100 184l6 62" stroke="#263238" stroke-width="3"/>

  <!-- braços -->
  <path d="M62 194c-14 6-20 18-17 30" stroke="#37474f" stroke-width="17" stroke-linecap="round" fill="none"/>
  <path d="M138 194c14 6 20 18 17 30" stroke="#37474f" stroke-width="17" stroke-linecap="round" fill="none"/>
  <!-- mãos verdes -->
  <circle cx="44" cy="228" r="11" fill="#7cb342"/>
  <circle cx="156" cy="228" r="11" fill="#7cb342"/>

  <!-- cabeça (achatada no topo) -->
