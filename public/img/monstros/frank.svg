  <!-- parafusos -->
  <g>
    <rect x="30" y="94" width="20" height="14" rx="5" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
    <rect x="150" y="94" width="20" height="14" rx="5" fill="#9e9e9e" stroke="#616161" stroke-width="2"/>
    <circle cx="40" cy="101" r="3" fill="#616161"/>
    <circle cx="160" cy="101" r="3" fill="#616161"/>
  </g>

  <!-- costura na bochecha -->
  <g stroke="#33691e" stroke-width="3" stroke-linecap="round">
    <path d="M62 118l26 6"/>
    <path d="M66 112v14M74 114v14M82 115v14"/>
  </g>

  <!-- olhos -->
  <ellipse cx="84" cy="96" rx="12" ry="14" fill="#fff"/>
  <ellipse cx="116" cy="96" rx="12" ry="14" fill="#fff"/>
  <circle cx="84" cy="97" r="7" fill="#33691e"/>
  <circle cx="116" cy="97" r="7" fill="#33691e"/>
  <circle cx="84" cy="97" r="3.5" fill="#1f1510"/>
  <circle cx="116" cy="97" r="3.5" fill="#1f1510"/>
  <circle cx="88" cy="92" r="2.5" fill="#fff"/>

  <!-- sobrancelhas -->
  <path d="M72 80h20M108 80h20" stroke="#212121" stroke-width="4" stroke-linecap="round"/>

  <!-- sorriso com dentes -->
  <path d="M88 122c8 8 24 8 32 0" stroke="#1f1510" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M94 124v6M106 126v6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
